services:
  db:
    image: postgres:16
    container_name: supplysense-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: supplysense
      POSTGRES_USER: supplysense
      POSTGRES_PASSWORD: supplysense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
